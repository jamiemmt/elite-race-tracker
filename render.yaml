services:
  - type: web
    name: elite-race-tracker-web
    env: node
    buildCommand: npm install && npm run install-client && npm run build && pip install garminconnect garth
    startCommand: node server/garmin-server.js
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: GROQ_API_KEY
        sync: false
      - key: GARMIN_EMAIL
        sync: false
      - key: GARMIN_PASSWORD
        sync: false
